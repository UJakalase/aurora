<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>

    <link rel="stylesheet" href="style.css" />
    <title>🌤️Aurora App</title>
  </head>
  <body>
    <!-- home page -->
    <div id="welcome-page" class="landing-page">
      <div class="overlay">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
              <h1 class="display-2 fw-bold">Aurora</h1>

              <p class="lead">Your daily weather beautifully simplified.</p>

              <input
                class="form-control search-home"
                placeholder="Search for a city"
              />

              <button id="startBtn" class="btn btn-primary btn-lg mt-4 px-5">
                Get Started
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- weather page -->
    <div id="forecast-page">
      <div class="container py-5">
        <div class="weather-card">
          <!-- Search -->
          <header>
            <form id="search-form" class="row g-3">
              <div class="col-md-9">
                <input
                  id="search-input"
                  class="form-control search-city"
                  type="text"
                  placeholder="Search for a city..."
                  required
                />
              </div>

              <div class="col-md-3">
                <button class="btn btn-dark w-100">
                  <i class="bi bi-search"></i>

                  Search
                </button>
              </div>
            </form>
          </header>

          <!-- Current Weather -->
          <main class="mt-5">
            <div class="row align-items-center">
              <!-- Left Side -->
              <div class="col-lg-7">
                <h1 id="current-city"></h1>

                <p class="weather-details">
                  <span id="time"></span>

                  •

                  <span id="description"></span>

                  <br />

                  Humidity:
                  <strong id="humidity"></strong>

                  &nbsp;&nbsp; Wind:
                  <strong id="wind-speed"></strong>
                </p>
              </div>

              <!-- Right Side -->

              <div class="col-lg-5 text-lg-end text-center mt-4 mt-lg-0">
                <div id="icon">
                  <img
                    src="http://shecodes-assets.s3.amazonaws.com/api/weather/icons/clear-sky-day.png"
                    class="weather-app-icon"
                  />
                </div>

                <div class="display-1 fw-bold">
                  <span id="current-temperature">14</span>°
                </div>
              </div>
            </div>
          </main>

          <!-- Forecast -->
          <div class="forecast-card mt-5">
            <div class="weather-forecast" id="forecast">
          </div>
       </div>

    <script src="script.js"></script>
  </body>
</html>
